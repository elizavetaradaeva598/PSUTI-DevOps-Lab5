services:
  db:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: kazan_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kazan_events"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/nelkor/kazan-events:latest
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_DB_NAME: kazan_events
      PG_USER_NAME: postgres
      PG_USER_PASSWORD: change-me
      SEED_MODE: sample
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
